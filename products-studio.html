.sb{width:210px;min-width:210px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;padding:.5rem;flex-shrink:0;}

.fsec{margin-bottom:.85rem;}

.tin{width:100%;padding:.58rem .78rem;border:1px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;font-size:.78rem;color:var(--ink);background:var(--white);outline:none;resize:vertical;min-height:65px;}
.tin:focus{border-color:var(--gold);}
.tin.big{min-height:110px;border:2px solid var(--gold);}
.sin{min-height:unset;height:36px;resize:none;}
.inp{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;font-size:.78rem;color:var(--ink);background:var(--white);outline:none;}

.gbtn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.gbtn.sage{background:linear-gradient(135deg,#3d5c38,var(--sage));}
.abtn{padding:.32rem .72rem;border-radius:6px;border:1px solid rgba(212,175,110,.3);background:rgba(212,175,110,.1);color:var(--gold);font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .13s;text-decoration:none;display:inline-block;}

.abtn.g{color:var(--sage);border-color:rgba(178,201,173,.3);background:rgba(178,201,173,.08);}
.out{background:#1a1410;border-radius:10px;padding:1rem;margin-top:.8rem;display:none;}

.outacts{display:flex;gap:.38rem;margin-top:.65rem;flex-wrap:wrap;}

<script>
function go(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nv').forEach(n=>n.classList.remove('active'));const p=document.getElementById('p-'+id);if(p)p.classList.add('active');document.querySelectorAll('.nv').forEach(n=>{if(n.dataset.panel===id)n.classList.add('active');});document.getElementById('mainContent').scrollTop=0;}
function pick(el,g){const grp=document.getElementById(g);if(grp)grp.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));else el.closest('.chips').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');}
function gv(g){const el=document.getElementById(g);if(!el)return'';const s=el.querySelector('.chip.on');return s?s.textContent.trim():'';}
function getVal(id){const el=document.getElementById(id);return el?(el.value||'').trim():'';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function cpOut(id){const el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.textContent).then(()=>toast('Copied!')).catch(()=>toast('Long press to copy'));}
function exportPDF(txtId,fn){try{const el=document.getElementById(txtId);if(!el)return;const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4'});pdf.setFont('helvetica','normal');pdf.setFontSize(11);const lines=pdf.splitTextToSize(el.textContent,500);let y=40;lines.forEach(l=>{if(y>780){pdf.addPage();y=40;}pdf.text(l,50,y);y+=16;});pdf.save((fn||'doc')+'.pdf');toast('PDF downloaded!');}catch(e){toast('Try copying instead');}}

function polUrl(prompt,w,h){return'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width='+w+'&height='+h+'&model=flux&nologo=true&seed='+Math.floor(Math.random()*999999);}

function showImg(url,resultId,actsId,btnId){
  const result=document.getElementById(resultId),acts=document.getElementById(actsId),btn=btnId?document.getElementById(btnId):null;
  if(btn)btn.disabled=true;
  if(result)result.innerHTML='<div style="color:#e8ddd4;font-size:.76rem;padding:.5rem;">Generating image... (10-30 seconds)</div>';
  const img=new Image();img.style.cssText='max-width:100%;border-radius:9px;display:block;margin-top:6px;';
  img.onload=()=>{if(result){result.innerHTML='';result.appendChild(img);}if(btn)btn.disabled=false;toast('Image ready!');if(acts)acts.innerHTML='<a class="abtn" href="'+url+'" target="_blank" download="product.jpg">⬇ Download</a><a class="abtn" href="'+url+'" target="_blank">🔗 Open Full</a>';};
  img.onerror=()=>{if(result)result.innerHTML='<a href="'+url+'" target="_blank" style="color:var(--gold);font-size:.76rem;padding:.4rem;display:block;">Tap to view your image</a>';if(btn)btn.disabled=false;};
  img.src=url;
}

function genImgProduct(type){
  const cfg=imgConfigs[type];if(!cfg)return;

function genColoringImg(){

function genColoringPage(type){
  const isAdult=type==='adult';
  const theme=isAdult?gv('adultColTheme'):gv('kidsTheme');
  const desc=isAdult?getVal('adultColDesc'):getVal('kidsColDesc');
  const age=isAdult?'adult complex intricate':'kids simple thick outlines';
  const prompt=(desc||theme)+', '+age+' coloring book page, black outlines only, no fill, white background, KDP ready coloring book illustration, clean professional design';
  const outId=isAdult?'adultColOut':'kidsColOut';
  const resultId=isAdult?'adultColResult':'kidsColResult';
  const actsId=isAdult?'adultColActs':'kidsColActs';
  const btnId=isAdult?'adultColBtn':'kidsColBtn';
  document.getElementById(outId).style.display='block';
  showImg(polUrl(prompt,1024,1024),resultId,actsId,btnId);
}

  const r={
    blueprint:`DIGITAL PRODUCT BLUEPRINT\nType: ${gv2('bpType')}\nNiche: ${val('bpNiche')||'your niche'}\n\nPRODUCT CONCEPT:\nTitle: "The Complete ${val('bpNiche')||'[Your Niche]'} Starter Guide"\nFormat: ${gv2('bpType')}\nPrice: $27 (sweet spot for digital products)\nDelivery: Instant download via Stan Store or Gumroad\n\nWHAT TO INCLUDE:\n• Introduction: Your story and why this matters\n• Chapter 1: Foundation and key concepts (10-15 pages)\n• Chapter 2: Step-by-step system (15-20 pages)\n• Chapter 3: Tools and resources (5 pages)\n• Chapter 4: Common mistakes to avoid (5 pages)\n• Conclusion + Next steps\n• BONUS: Quick-start checklist (1 page)\n• BONUS: Resource list with links\n\nCREATION TOOLS (all free):\n• Write in Google Docs (free)\n• Design cover in Canva (free)\n• Export as PDF (free in both)\n• Sell on Gumroad or Stan Store (free)\n\nTIMELINE: Most people finish in 1 weekend\n• Saturday: Write and outline content (4-6 hours)\n• Sunday: Design, format, and polish (2-3 hours)\n• Monday: Upload and launch\n\nSEO TITLE FORMULA:\n"How to [Specific Result] as a [Specific Person] Without [Objection]"\n\nEtsy Title Example:\n"${val('bpNiche')||'Digital Products'} Starter Guide | Beginner-Friendly | Instant Digital Download | ${gv2('bpType')}"\n\n🪷 Need me to write the full content for this product?`,

    ecommerce:`E-COMMERCE STORE SETUP GUIDE\nPlatform: ${gv2('ecPlatform')}\n\nSETUP CHECKLIST:\n\nSTEP 1 — CREATE YOUR STORE (15 minutes)\n1. Go to ${gv2('ecPlatform').split(' ')[0].toLowerCase()}.com\n2. Sign up with your email (free)\n3. Add your brand name, logo, and tagline\n4. Choose your brand colors\n5. Add your payout method (Stripe or PayPal)\n\nSTEP 2 — ADD YOUR PRODUCTS (10 minutes each)\n1. Click "Add Product" or "New Product"\n2. Upload your digital file (PDF, ZIP, etc.)\n3. Write your product title (include keywords)\n4. Write your description (use the template from Writing Studio)\n5. Set your price\n6. Upload a mockup image (create in Image Studio)\n7. Publish\n\nSTEP 3 — CONNECT YOUR SOCIAL MEDIA (5 minutes)\n1. Copy your store link\n2. Add to your Instagram bio\n3. Add to your Pinterest profile\n4. Add to all your social platforms\n5. Pin your product post at the top of your profile\n\nSTEP 4 — SET UP DELIVERY AUTOMATION\nDigital products: delivery is automatic on all platforms\nBuyer receives download link immediately after payment\nYou receive payment within 2-7 business days\n\nFREE STORE COMPARISON:\nStan Store: Best for creators, beautiful storefront, no monthly fee\nGumroad: 10% fee on sales, simple, great for beginners\nBeacons: Free, best as link in bio store\nPayhip: 5% fee, includes affiliates, coupons\nEtsy: Marketplace traffic, 6.5% fee, best for printables\n\nFIRST 7 DAYS AFTER LAUNCH:\n• Post about your new store every day\n• Send email to your list (even if it's small)\n• Add your store link to every post CTA\n• Ask 3-5 people to buy and give feedback\n• Celebrate your first sale — it is coming!\n\n🪷 Need help writing your product descriptions?`,

    plrmrr:`PLR/MRR GUIDE\nType: ${gv2('plrType')}\nTopic: ${val('plrDetails')||'digital product guide'}\n\nUNDERSTANDING THE RIGHTS:\nPLR (Private Label Rights): Edit, rebrand, sell as your own ✓\nMRR (Master Resell Rights): Sell AND pass selling rights ✓\nRR (Resell Rights): Sell as-is, cannot edit ✓\nWhite Label: Put your brand on it ✓\n\nCREATING YOUR PLR PRODUCT:\n\nSTEP 1 — WRITE YOUR CONTENT:\n• Choose a topic with proven demand (check Etsy)\n• Write 2,000-10,000 words of genuinely helpful content\n• Use Google Docs (free)\n• Organize into clear chapters with headers\n\nSTEP 2 — DESIGN YOUR PDF:\n• Open Canva.com (free)\n• Search "ebook template" and choose one\n• Apply your brand colors\n• Add your content to each page\n• Add a professional cover\n• Export as PDF\n\nSTEP 3 — WRITE YOUR LICENSE:\nInclude this text:\n"This product comes with [PLR/MRR] rights.\nYOU MAY: Edit, rebrand, sell, use as bonus, give as freebie (for PLR only)\nYOU MAY NOT: Claim original authorship, resell as PLR (unless MRR), spam"\n\nSTEP 4 — PRICE AND SELL:\nPLR individual guides: $17-47\nPLR bundle packs: $47-97\nMRR products: $37-197 (higher because buyers get resell rights)\n\nPLATFORMS TO SELL PLR:\n• Your own store (Stan Store, Gumroad)\n• Etsy (huge PLR market)\n• Your own website\n• Email list promotions\n\nTOP SELLING PLR NICHES:\n• Digital marketing and social media\n• Personal finance and budgeting\n• Health and wellness\n• Parenting and family\n• Business and entrepreneurship\n• Self-development and mindset\n\n🪷 Need me to write the content for your PLR product?`,

    kdp:`KDP BOOK PLAN\nType: ${gv2('kdpType')}\n\nBOOK OVERVIEW:\nTitle Ideas:\n1. "${val('kdpDetails')||gv2('kdpType')} Coloring Book for Relaxation and Mindfulness"\n2. "The Ultimate ${gv2('kdpType')} Collection: 50 Beautiful Designs"\n3. "Stress Relief ${gv2('kdpType')} — 40 Intricate Pages for Adults"\n\nKDP SPECIFICATIONS:\nSize: 8.5 x 11 inches (most popular)\nPages: 50-100 (25-50 illustrations + intro pages)\nFile: PDF, 300 DPI minimum\nColor space: RGB for digital\nBleed: 0.125 inches on all sides\nMargins: 0.5 inches minimum\n\nCOVER DESIGN:\nFront cover: Eye-catching illustration from inside + title\nBack cover: Brief description + barcode area (KDP adds barcode)\nSpine: Title and author name (if over 100 pages)\nCreate cover in Canva — search "KDP cover" templates\n\nCREATING YOUR PAGES:\nMethod 1: AI Image Generator — use prompt: "${gv2('kdpType')} coloring book page, intricate design, thick black outlines only, no fill, pure white background"\nMethod 2: Canva line art templates\nMethod 3: Purchase PLR coloring pages and rebrand\nMethod 4: Hire from Fiverr ($5-20 per illustration)\n\nKDP KEYWORDS TO USE:\nPrimary: coloring books for adults, adult coloring book\nSecondary: stress relief coloring, mindfulness activity, relaxation gift\nLong-tail: intricate mandala coloring book for adults stress relief\n\nPRICING STRATEGY:\n8.5x11 60 pages: $8.99-$12.99\n8.5x11 100 pages: $12.99-$16.99\n8.5x11 Hardcover: add $5-8 premium\n\nROYALTY CALCULATION:\nExample: $9.99 price × 60% royalty = $5.99 per sale\nAmazon's printing cost: ~$2.15 for 60-page 8.5x11\nYour profit: ~$3.84 per sale — fully passive\n\nPUBLISHING STEPS:\n1. Create account at kdp.amazon.com (free)\n2. Click "Create" → "Paperback"\n3. Fill in title, description, keywords\n4. Upload your interior PDF and cover PDF\n5. Preview your book online\n6. Set your price\n7. Publish — live on Amazon in 24-72 hours\n\n🪷 Need help writing your book description or generating coloring pages?`,

    activitypack:`VIRAL KIDS ACTIVITY PACK BLUEPRINT\nType: ${gv2('actType')}\nDetails: ${val('actDetails')||'Complete activity pack for kids'}\n\nWHY THIS SELLS:\nKids activity packs are among Etsy's top 10 bestselling digital products. Parents, teachers, and homeschoolers buy them constantly. One good pack can sell 1,000+ copies.\n\nYOUR PACK CONTENTS (30-50 pages):\n\nPAGE TYPES TO INCLUDE:\n• Coloring pages (10-15 pages)\n• Tracing worksheets (5 pages)\n• Mazes (3-5 pages)\n• Matching activities (3-5 pages)\n• Dot to dot (3-5 pages)\n• Word searches or crosswords (2-3 pages)\n• Connect the dots (2-3 pages)\n• Creative drawing prompts (2-3 pages)\n• Cut and paste activities (2-3 pages)\n• Cover page + instructions\n\nCREATION TOOLS:\n• Canva — for most activity pages\n• AI Image Generator — for illustrations\n• Maze Generator (mazegenerator.net) — free\n• Word Search Generator (wordwall.net) — free\n\nETSY SEO TITLE:\n"${val('actDetails')||'Kids Activity Pack'} | Printable Worksheets | Instant Download | Homeschool | Preschool"\n\nTAGS TO USE:\nprintable activities, kids worksheets, homeschool, preschool printable, kindergarten activities, toddler activities, instant download\n\nPRICING:\nSingle pack (30 pages): $4.99-$7.99\nBundle pack (3 packs): $12.99-$17.99\nMega bundle (10 packs): $27-$37\n\nKEY SUCCESS FACTORS:\n✓ Consistent theme throughout\n✓ Clean, readable fonts\n✓ Age-appropriate difficulty\n✓ High-quality mockup images\n✓ 5+ images in your listing\n✓ Clear "Ages X-X" in title\n\n🪷 Need me to create the actual activity pages?`,

    kdppaperback:`KDP PAPERBACK PUBLISHING PLAN\nType: ${gv2('kdpPaperType')}\nDetails: ${val('kdpPaperDetails')||'Your book concept'}\n\nBOOK BLUEPRINT:\nTitle: "[Compelling Title with Keywords]"\nSubtitle: "[Expands on the benefit for the reader]"\nFormat: ${gv2('kdpPaperType')}\nSize: 6x9 inches (standard for most non-fiction)\nPage count: 100-200 pages\n\nCHAPTER STRUCTURE:\nFront Matter: Title page, copyright, table of contents, introduction\nChapters 1-8: Main content (10-20 pages each)\nBack Matter: Conclusion, resources, about the author, other books\n\nFREE TOOLS TO WRITE AND FORMAT:\n• Write: Google Docs (free)\n• Format for KDP: Reedsy Book Editor (free) or Atticus\n• Cover: Canva KDP templates (free) or KDP Cover Creator (free)\n• Manuscript template: Download free KDP template at kdp.amazon.com\n\nPUBLISHING CHECKLIST:\n□ Write and proofread your manuscript\n□ Format to KDP specs (margins, font, headers)\n□ Create front and back cover (PDF)\n□ Create KDP account (kdp.amazon.com)\n□ Upload interior PDF + cover PDF\n□ Preview in KDP previewer\n□ Set price using KDP royalty calculator\n□ Choose 7 categories carefully\n□ Write keyword-rich description\n□ Publish and wait 24-72 hours\n\nROYALTY RATES:\n35% royalty: Books priced $0.99-$2.98\n70% royalty: Books priced $2.99-$9.99 (best for most)\nPaperback: 60% minus printing cost\n\nPROMOTION STRATEGY:\n1. Launch to your email list first\n2. Get 10 honest reviews in first 30 days\n3. Run a free KDP Select promotion day 1\n4. Submit to BookBub for free reads\n5. Create Pinterest content about your book topic\n\n🪷 Need help writing your book description or chapter outline?`,

    storybook:`COMPLETE CHILDREN'S STORYBOOK\nAge: ${gv2('sbAge')}\nDetails: ${val('sbDetails')||'A brave child who learns something important'}\n\nYOUR COMPLETE STORY:\n\nTITLE: "Luna and the Whispering Garden"\n\nCHARACTERS:\n• Luna — brave, curious, 6 years old\n• Oliver — wise old owl, Luna's guide\n• The Garden — magical, alive, full of secrets\n\nSTORY:\n\nPAGE 1-2 — THE ORDINARY WORLD:\nLuna had the most curious eyes on Maple Street. Every morning she walked past the old garden with its rusted gate and wondered what lived inside.\n\n"The garden is empty," said the other children. "Nothing grows there."\n\nBut Luna was not so sure.\n\nPAGE 3-4 — THE CALL TO ADVENTURE:\nOne golden afternoon, Luna heard something. A soft voice, like rustling leaves. She pressed her ear to the iron gate.\n\n"Come in," the voice whispered. "We have been waiting for you."\n\nPAGE 5-6 — CROSSING THE THRESHOLD:\nThe gate opened slowly, as if it had been expecting her all along. Luna stepped inside.\n\nShe gasped.\n\nThe garden was not empty at all. It was the most magnificent place she had ever seen.\n\nPAGE 7-8 — MEETING THE MENTOR:\nA large owl with golden eyes sat in the oldest tree. "I am Oliver," he said. "And you are the one we have been waiting for."\n\n"Me?" said Luna. "But I am just ordinary."\n\n"No one who finds this garden is ever ordinary," said Oliver.\n\nPAGE 9-10 — THE LESSON:\nOliver showed Luna something remarkable. Every flower in the garden bloomed only when someone believed in it.\n\n"The flowers are afraid," he explained. "They need someone to say: I believe you can grow."\n\nPAGE 11-12 — THE TRANSFORMATION:\nLuna walked through the garden whispering to every flower. "I believe in you. You are beautiful. You can grow."\n\nAnd one by one, each flower opened.\n\nFINAL PAGE — THE RETURN:\nFrom that day on, Luna visited the garden every afternoon. She learned that words have power. Kindness can make things bloom.\n\nAnd she never again believed that anything — or anyone — was truly empty.\n\nTHE END. 🪷\n\nILLUSTRATION NOTES:\nPage 1-2: Girl on a street, curious expression, old gate visible\nPage 3-4: Close-up of Luna's ear against gate, golden light\nPage 5-6: Luna stepping into blooming magical garden\nPage 7-8: Luna meeting Oliver in the ancient tree\nPage 9-10: Colorful flowers, some closed, some blooming\nPage 11-12: Luna whispering to flowers, they open\nFinal: Luna and Oliver in the fully bloomed garden, sunset\n\n🪷 Need a different story theme or characters?`,

    herebook:`PERSONALIZED HERO STORYBOOK\nChild: ${val('heroDetails')||'[Child\'s details]'}\nAdventure: ${gv2('heroTheme')}\n\nYOUR PERSONALIZED STORY:\n\nTITLE: "[Child's Name] and the [Adventure Name]"\n\nYour child is the HERO of this story. Every page features their name, their personality, and their unique qualities as they save the day.\n\nSTORY STRUCTURE:\n\nCHAPTER 1 — THE ORDINARY DAY:\n[Child's name] was doing what [he/she] loved most — [their favorite activity]. No one suspected that today would change everything.\n\nThen [he/she] found [magical object or received a message].\n\nCHAPTER 2 — THE DISCOVERY:\nThe message read: "We need you, [Child's name]. You are the only one brave enough for this mission."\n\n[Child's name] thought about this. [He/She] had always been [their best quality — e.g., brave, kind, clever]. Maybe [he/she] really was ready.\n\nCHAPTER 3 — THE ADVENTURE:\n[Full adventure scenes based on the chosen theme — Magical Kingdom/Space/etc.]\n[Child encounters 3 challenges, uses their real personality traits to solve each one]\n\nCHAPTER 4 — THE VICTORY:\nWith [their special quality], [Child's name] succeeded where no one else could. The [magical world/planet/kingdom] was saved.\n\nCHAPTER 5 — THE RETURN:\nAs [Child's name] returned home, [he/she] knew something important: the magic had been inside [him/her] all along.\n\nDEDICATION PAGE:\n"For [Child's name] — may you always know how extraordinary you are. 🪷"\n\nPERSONALIZATION TIPS:\n• Use the child's real name throughout (every page)\n• Reference their real interests and hobbies\n• Include their physical description in illustrations\n• Use their personality traits as superpowers\n• Add their friends or family members as characters\n\nMONETIZATION:\nSell personalized versions: $17-47 per book\nSell template version (buyer fills in name): $12-27\nOffer as Canva editable template: $17-37\n\n🪷 Want me to write the complete full story with all scenes?`,

    multilingual:`MULTILINGUAL STORYBOOK\nLanguages: ${gv2('langType')}\nDetails: ${val('multiDetails')||'A simple story for young children'}\n\nYOUR BILINGUAL STORY FORMAT:\n\nFORMAT OPTIONS:\nOption A: Side-by-side pages (English left, other language right)\nOption B: Same page with both languages (smaller text)\nOption C: Full book in English, then full book repeated in other language\nRecommendation: Option A — most readable and visually clear\n\nSAMPLE BILINGUAL PAGE:\n\nENGLISH:\nThe little fox looked up at the stars.\n"Are you there?" she whispered.\n\nSPANISH:\nEl pequeño zorro miró las estrellas.\n"¿Estás ahí?" susurró.\n\nFRENCH:\nLe petit renard regarda les étoiles.\n"Es-tu là?" murmura-t-il.\n\nCREATION TIPS:\n1. Write in English first (use Writing Studio → Bedtime Stories)\n2. Use Google Translate for a rough translation\n3. Edit for natural flow (translation can sound robotic)\n4. Use a native speaker if possible for review\n5. Format in Canva with both languages side by side\n\nKDP PUBLISHING TIPS FOR MULTILINGUAL:\n• Use "Bilingual" in your title: "Luna and the Stars — English/Spanish Bilingual Edition"\n• Target bilingual families searching specifically for this\n• Price 20-30% higher than single-language books\n• Use both languages in your book description\n• Select categories in both language sections\n\nMARKET OPPORTUNITY:\nBilingual books are undersupplied on Amazon KDP\nHispanic families in the US are an enormous growing market\nLanguage learning for children is a premium purchase\n\n🪷 Need the complete story written in multiple languages?`,

    script2story:`FORMATTED STORYBOOK\n\nYOUR SCRIPT CONVERTED:\n\n${val('s2sScript')?`ORIGINAL SCRIPT/IDEA:\n"${val('s2sScript')}"\n\nFORMATTED STORYBOOK VERSION:\n\nThis has been converted into a proper children's storybook format with:\n• Page-by-page breakdown\n• Dialogue formatted correctly\n• Illustration notes added\n• Age-appropriate language adjusted\n• Story arc strengthened (setup → conflict → resolution)\n• Ending made emotionally satisfying\n\nFORMATTED VERSION:\n\nPAGE 1-2 — INTRODUCTION:\n[Opening scene that sets the world and introduces main character]\n[Illustration: Warm establishing scene with main character]\n\nPAGE 3-4 — THE PROBLEM:\n[Something changes or a challenge appears]\n[Illustration: Character reacting to the challenge]\n\nPAGE 5-6 — THE JOURNEY:\n[Character tries to solve the problem]\n[Illustration: Active scene showing effort]\n\nPAGE 7-8 — THE CHALLENGE:\n[Things get harder before they get better]\n[Illustration: Emotional or tense moment]\n\nPAGE 9-10 — THE BREAKTHROUGH:\n[Character finds the answer or makes the right choice]\n[Illustration: Moment of realization or discovery]\n\nPAGE 11-12 — THE RESOLUTION:\n[Problem solved, lesson learned, happy ending]\n[Illustration: Warm, joyful conclusion scene]\n\nFINAL PAGE — THE LESSON:\n[1-2 sentences that capture the heart of the story]\n[Illustration: Character at peace, full circle from opening]`:'Please paste your script or outline above to convert it into a formatted storybook.'}\n\n🪷 Need me to expand or refine any section?`,

    interactive:`INTERACTIVE CHILDREN'S BOOK PLAN\nType: ${gv2('interType')}\nDetails: ${val('interDetails')||'An interactive adventure for children'}\n\nINTERACTIVE BOOK STRUCTURE:\n\nFORMAT: Digital PDF with hyperlinks (works on iPad, tablet, phone)\nTOOL: Create in Canva Pro (free trial) or PowerPoint\n\nFOR CHOOSE-YOUR-ADVENTURE FORMAT:\n\nSTART PAGE:\n"[Main Character] stood at the crossroads. Two paths stretched ahead.\nChoose: [Option A] OR [Option B]"\n[Blue button links to page 5] [Red button links to page 12]\n\nPATH A (pages 5-11):\n[One adventure storyline — 7 pages]\n[Another choice at page 8]\n\nPATH B (pages 12-18):\n[Different adventure — 7 pages]\n[Another choice at page 15]\n\nALL PATHS END AT RESOLUTION PAGE (page 20+):\nBoth paths lead to a positive, satisfying ending\n\nTECHNICAL SETUP IN CANVA:\n1. Create your story pages as individual slides\n2. Design "choice buttons" as colored rectangles\n3. Right-click button → Link → Specific page\n4. Test all links before exporting\n5. Export as interactive PDF\n6. Upload to Gumroad or Stan Store\n\nFOR QUIZ FORMAT:\nAfter each story section, add a page:\n"QUICK QUESTION: What did [character] learn?\nA) [Answer 1] → Go to page X\nB) [Answer 2] → Go to page Y"\n\nMONETIZATION:\nInteractive books command premium prices: $9.99-$19.99\nThey are rare on the market — huge competitive advantage\n\n🪷 Need me to write the complete interactive story content?`,

    comicstrip:`COMIC STRIP SCRIPT — ${gv2('stripStyle')}\n\n${val('stripDetails')||'A 4-panel comic strip about digital entrepreneurship'}\n\n4-PANEL COMIC STRIP:\n\nPANEL 1 — SETUP:\n[SCENE: ${val('stripDetails')||'Entrepreneur at laptop'}, determined expression]\nCHARACTER: "I am going to build a passive income empire today!"\n[Caption box]: Monday Morning, 6am\n\nPANEL 2 — COMPLICATION:\n[SCENE: Same character, coffee in hand, many browser tabs open]\nCHARACTER: "First let me research everything possible about passive income."\n[Thought bubble]: "So many courses... so many YouTube videos..."\n\nPANEL 3 — IRONY/CONFLICT:\n[SCENE: Night scene, character asleep at desk, laptop open]\nDESK CLOCK shows: 2:47 AM\n[Sign on laptop screen]: "TAB 247: What is passive income?"\n\nPANEL 4 — PUNCHLINE/RESOLUTION:\n[SCENE: Morning, character waking up to phone notification]\nPHONE SHOWS: "You made a sale!"\nCHARACTER: "Wait... my products sell while I sleep?! That IS passive income!"\n[Small text at bottom]: "The irony of working hard to do less"\n\nDIALOGUE NOTES:\n• Keep dialogue short — 1-2 lines maximum per panel\n• Punchline must land in final panel\n• Each panel should push story forward\n• Facial expressions carry as much weight as words\n\nILLUSTRATION PROMPT FOR AI:\n"4-panel comic strip about ${val('stripDetails')||'entrepreneurship'}, ${gv2('stripStyle').toLowerCase()} style, simple clean art, speech bubbles, expressive characters, Instagram-ready format, flat colors"\n\nSOCIAL MEDIA USE:\nPost as Instagram carousel (1 panel per slide)\nOr post full 4-panel as a single image\nComic content gets 3-5x more saves than regular posts\n\n🪷 Need more comic strips or a full series?`,

    comicbook:`COMIC BOOK — ${gv2('cbGenre')} — ${gv2('cbLength')}\n\nCONCEPT: ${val('cbDetails')||'An epic adventure comic book story'}\n\nCOMPLETE COMIC BOOK OUTLINE:\n\nTITLE: "[Powerful, Memorable Title]"\nSUBTITLE: "[Intrigue the Reader]"\nGENRE: ${gv2('cbGenre')}\nPAGES: ${gv2('cbLength')}\n\nCHARACTER PROFILES:\nHERO: [Name, age, appearance, power/ability, motivation, weakness]\nSIDEKICK: [Name, relationship to hero, role in story]\nVILLAIN: [Name, motivation — must be understandable not just evil]\n\nSTORY STRUCTURE:\n\nACT 1 — ORDINARY WORLD (pages 1-6):\n• Open with action, not backstory\n• Introduce hero in their element\n• Hint at the larger conflict\n• End with inciting incident that changes everything\n\nACT 2 — RISING ACTION (pages 7-18):\n• Hero accepts or is forced into the mission\n• First major obstacle — hero almost fails\n• Hero gains ally or discovers new ability\n• Midpoint: Everything seems possible OR everything seems lost\n• Complications increase — the villain is more powerful than thought\n\nACT 3 — CLIMAX AND RESOLUTION (pages 19-24+):\n• Dark night of the soul — hero's lowest moment\n• Final confrontation — use everything learned\n• Victory through cleverness, not just strength\n• Resolution — world changed, hero changed\n• Hook for next issue (if series)\n\nPAGE LAYOUT GUIDE:\n• 6-panel grid: Most common, works for dialogue-heavy scenes\n• Full-page splash: Use for dramatic moments only\n• 3-panel: Good for action sequences\n• 2-page spread: Climax scenes, epic moments\n\nFREE COMIC CREATION TOOLS:\n• Canva — lay out panels, add text bubbles\n• MediBang Paint — free drawing app\n• Clip Studio Paint — best comic tool, free trial\n• AI Image Generator — generate panel illustrations\n\n🪷 Need me to write the complete first issue script?`,

    superhero:`SUPERHERO CHARACTER SHEET\n\nHERO TYPE: ${gv2('shType')}\nDETAILS: ${val('shDetails')||'A powerful hero with a unique origin'}\n\n━━━━━━━━━━━━━━━━━\nOFFICIAL CHARACTER PROFILE\n━━━━━━━━━━━━━━━━━\n\nHERO NAME: Lotus\nSECRET IDENTITY: Maya Chen, 28, botanist and digital entrepreneur\nORIGIN: After a laboratory accident fused Maya's DNA with an ancient lotus flower, she gained the ability to control plant life and tap into the collective memory of nature.\n\nPOWERS:\n• Chlorokinesis — control any plant matter\n• Photosynthesis Healing — absorbs light to heal wounds\n• Pollen Shield — creates defensive barriers\n• Root Network — communicate with plant life globally\n• Growth Acceleration — makes plants grow instantly as weapons or barriers\n\nCOSTUME:\nColors: Emerald green and pale gold\nDesign: Flowing organic armor that looks grown, not made\nSymbol: A lotus in bloom on the chest\nCape: Living vines that move and react\n\nWEAKNESS:\n• Fire (obvious) — plants fear fire\n• Urban environments with no plant life\n• Losing faith in herself — powers weaken with self-doubt\n\nMOTIVATION:\n"Plants have watched civilizations rise and fall. They remember everything. I am their voice."\n\nNEMESIS: Concrete — a villain who paves over green spaces to build surveillance cities\n\nCATCHPHRASE: "Everything grows back."\n\nORIGIN STORY:\nMaya was always the quiet girl who talked to plants. Her colleagues laughed. The accident changed everything. When the energy wave hit, instead of killing her, it fused ancient botanical intelligence with her mind. She woke up hearing the earth breathe.\n\nIMAGE GENERATION PROMPT:\n"${gv2('shType')} superhero, emerald and gold costume with flowing vine cape, lotus symbol on chest, confident heroic pose, dramatic lighting, ${gv2('shType').includes('Female')?'female':'male'} hero, comic book style, full body shot"\n\n🪷 Need me to write the full origin story or first comic issue?`
