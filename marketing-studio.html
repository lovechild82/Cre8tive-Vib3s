:root{--blush:#f2c4ce;--blush2:rgba(242,196,206,0.13);--sage:#b2c9ad;--gold:#d4af6e;--gold2:rgba(212,175,110,0.12);--cream:#faf6f0;--ink:#1a1410;--ink2:#3d342e;--muted:#9a8e85;--white:#fff;--border:rgba(212,175,110,0.2);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Outfit',sans-serif;font-weight:300;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
a{text-decoration:none;color:inherit;}
.topnav{height:52px;background:linear-gradient(135deg,#fdf8f3,#f5ede0);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 .8rem;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:.5rem;}
.lotus{font-size:1.3rem;animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bn{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;}
.bn span{color:var(--gold);}
.navlinks{display:flex;gap:.2rem;overflow-x:auto;}
.navlinks::-webkit-scrollbar{display:none;}
.nl{padding:.28rem .55rem;border-radius:6px;font-size:.68rem;color:var(--ink2);white-space:nowrap;border:1px solid transparent;}
.nl:hover{background:var(--gold2);}
.nl.active{background:linear-gradient(135deg,rgba(242,196,206,0.15),var(--gold2));color:var(--ink);font-weight:500;border-color:var(--border);}
.app{display:flex;flex:1;overflow:hidden;}
.sb{width:210px;min-width:210px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;padding:.5rem;flex-shrink:0;}
.sb::-webkit-scrollbar{width:2px;}
.slbl{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:.45rem .45rem .15rem;}
.nv{display:flex;align-items:center;gap:.4rem;padding:.42rem .55rem;border-radius:6px;border:none;background:none;cursor:pointer;width:100%;text-align:left;color:var(--ink2);font-family:'Outfit',sans-serif;font-size:.71rem;transition:all .13s;}
.nv:hover{background:var(--gold2);}
.nv.active{background:linear-gradient(135deg,var(--blush2),var(--gold2));color:var(--ink);font-weight:500;border:1px solid var(--border);}
.ni{font-size:.85rem;min-width:17px;text-align:center;}
.sd{height:1px;background:var(--border);margin:.18rem 0;}
.main{flex:1;overflow-y:auto;padding:1rem;}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:.9rem;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blush),var(--gold),var(--sage));}
.card h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;margin-bottom:.25rem;}
.card p{font-size:.78rem;line-height:1.6;color:var(--ink2);}
.flbl{font-family:'DM Mono',monospace;font-size:.53rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:.38rem;display:block;}
.fsec{margin-bottom:.85rem;}
.chips{display:flex;flex-wrap:wrap;gap:.28rem;}
.chip{padding:.3rem .68rem;border-radius:18px;border:1px solid var(--border);background:var(--white);font-size:.7rem;cursor:pointer;color:var(--ink2);transition:all .13s;}
.chip:hover{border-color:var(--gold);background:var(--gold2);}
.chip.on{background:linear-gradient(135deg,var(--blush),var(--gold));border-color:var(--gold);color:var(--ink);font-weight:500;}
.tin{width:100%;padding:.58rem .78rem;border:1px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;font-size:.78rem;color:var(--ink);background:var(--white);outline:none;resize:vertical;min-height:65px;}
.tin:focus{border-color:var(--gold);}
.tin.big{min-height:110px;border:2px solid var(--gold);}
.sin{min-height:unset;height:36px;resize:none;}
.inp{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;font-size:.78rem;color:var(--ink);background:var(--white);outline:none;}
.inp:focus{border-color:var(--gold);}
.gbtn{width:100%;padding:.75rem;background:linear-gradient(135deg,#c9956a,var(--gold));border:none;border-radius:9px;font-family:'Outfit',sans-serif;font-size:.84rem;font-weight:600;color:var(--ink);cursor:pointer;transition:all .22s;margin-top:.7rem;}
.gbtn:hover{box-shadow:0 4px 18px rgba(212,175,110,.32);transform:translateY(-1px);}
.gbtn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.gbtn.sage{background:linear-gradient(135deg,#3d5c38,var(--sage));}
.abtn{padding:.32rem .72rem;border-radius:6px;border:1px solid rgba(212,175,110,.3);background:rgba(212,175,110,.1);color:var(--gold);font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .13s;text-decoration:none;display:inline-block;}
.abtn:hover{background:rgba(212,175,110,.22);}
.abtn.g{color:var(--sage);border-color:rgba(178,201,173,.3);background:rgba(178,201,173,.08);}
.out{background:#1a1410;border-radius:10px;padding:1rem;margin-top:.8rem;display:none;}
.outlbl{font-family:'DM Mono',monospace;font-size:.53rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;}
.outtxt{font-family:'Outfit',sans-serif;font-size:.78rem;line-height:1.78;color:#e8ddd4;white-space:pre-wrap;word-break:break-word;}
.outacts{display:flex;gap:.38rem;margin-top:.65rem;flex-wrap:wrap;}
.badge{display:inline-block;font-family:'DM Mono',monospace;font-size:.52rem;padding:.17rem .5rem;border-radius:7px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.4rem;}
.bf{background:rgba(178,201,173,.18);color:#3d5c38;border:1px solid rgba(178,201,173,.4);}
.ba{background:rgba(212,175,110,.15);color:#7a5c1e;border:1px solid rgba(212,175,110,.35);}
.toast{position:fixed;bottom:1rem;right:1rem;background:var(--ink);color:var(--gold);font-family:'DM Mono',monospace;font-size:.64rem;padding:.48rem .88rem;border-radius:8px;border:1px solid var(--gold);z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>

<script>
function go(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nv').forEach(n=>n.classList.remove('active'));const p=document.getElementById('p-'+id);if(p)p.classList.add('active');document.querySelectorAll('.nv').forEach(n=>{if(n.dataset.panel===id)n.classList.add('active');});document.getElementById('mainContent').scrollTop=0;}
function pick(el,g){const grp=document.getElementById(g);if(grp)grp.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));else el.closest('.chips').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');}
function gv(g){const el=document.getElementById(g);if(!el)return'';const s=el.querySelector('.chip.on');return s?s.textContent.trim():'';}
function getVal(id){const el=document.getElementById(id);return el?(el.value||'').trim():'';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function cpOut(id){const el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.textContent).then(()=>toast('Copied!')).catch(()=>toast('Long press to copy'));}
function exportPDF(txtId,filename){try{const el=document.getElementById(txtId);if(!el)return;const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4'});pdf.setFont('helvetica','normal');pdf.setFontSize(11);const lines=pdf.splitTextToSize(el.textContent,500);let y=40;lines.forEach(l=>{if(y>780){pdf.addPage();y=40;}pdf.text(l,50,y);y+=16;});pdf.save((filename||'document')+'.pdf');toast('PDF downloaded!');}catch(e){toast('Try copying instead');}}

window.addEventListener('load',()=>{const t=sessionStorage.getItem('gotoPanel');if(t){sessionStorage.removeItem('gotoPanel');go(t);}});

function genMarketing(type){
  const outId='out-'+type, txtId='outtxt-'+type;
  const out=document.getElementById(outId), txt=document.getElementById(txtId);
  if(!out||!txt)return;
  out.style.display='block';
  txt.textContent=buildMarketingContent(type);
}

function buildMarketingContent(type){
  const gv2=g=>{const el=document.getElementById(g);if(!el)return'';const s=el.querySelector('.chip.on');return s?s.textContent.trim():'';};
  const val=id=>{const el=document.getElementById(id);return el?(el.value||'').trim():'';};

  const responses={
    funnels:`SALES FUNNEL — ${gv2('funnelType')||'Lead Magnet to Product'}\n\nYOUR COMPLETE FUNNEL:\n\nSTEP 1 — ATTRACT (Free Traffic)\nPlatform: Pinterest + Instagram (both free)\nContent: Post 1-2 educational pieces daily\nGoal: Drive cold traffic to your lead magnet page\n\nSTEP 2 — CAPTURE (Free Lead Magnet)\nOffer: Free PDF guide or checklist\nTitle: "The [Result] Blueprint for [Audience]"\nTool: Stan Store or Beacons (both free)\nEmail: ConvertKit (free up to 1,000 subscribers)\n\nSTEP 3 — CONVERT (Core Offer)\nPresent in 5-7 day email sequence\nPrice: $27-$97\nDeliver: Instant download via Stan Store\nBonus: Add 2-3 free bonuses to increase value\n\nSTEP 4 — ASCEND (Upsell)\nOffer immediately after purchase OR in Day 7 email\nPrice: $97-$197\n1 specific upgrade or premium version\n\nSTEP 5 — RETAIN (Email Sequence)\nDay 1: Deliver freebie + warm welcome\nDay 2: Your brand story + connection\nDay 3: Educational value + soft mention\nDay 4: FAQ and objection handling\nDay 5: Social proof or testimonial\nDay 6: Direct offer with urgency\nDay 7: Final reminder — bonus expires tonight\n\nFREE TOOLS STACK:\nSales: Stan Store or Beacons\nEmail: ConvertKit (free to 1k)\nPayments: Stripe (free to set up)\nDesign: Canva (free tier)\nAnalytics: Metricool (free)\n\nKEY METRICS TO TRACK:\n• Email open rate (goal: 25%+)\n• Click through rate (goal: 3%+)\n• Conversion rate (goal: 1-3%)\n• Revenue per email sent\n\n🪷 Need me to build any specific step in more detail?`,

    affiliate:`AFFILIATE SYSTEM — ${gv2('affType')||'Create Your Own Program'}\n\nYOUR AFFILIATE PROGRAM SETUP:\n\nPLATFORM RECOMMENDATION (all free):\n• ThriveCart — best for digital products, affiliate built-in\n• Gumroad — built-in affiliate system, free\n• Payhip — built-in affiliates, free\n• Stan Store — affiliate feature available\n• Impact.com — professional affiliate platform\n\nCOMMISSION STRUCTURE:\n• Entry products ($7-27): 30-50% commission\n• Core products ($27-97): 30-40% commission  \n• High ticket ($97+): 20-30% commission\nRule: Higher commission = more motivated affiliates\n\nYOUR AFFILIATE PROGRAM DESCRIPTION:\n"Join the [Brand Name] Affiliate Program and earn [X]% commission on every sale you refer. Promote products you genuinely love and get paid every time someone buys through your link."\n\nAFFILIATE RECRUITMENT STRATEGY:\n1. Your own customers (email them first)\n2. People who comment positively on your content\n3. Creators in complementary niches\n4. Fellow students or community members\n5. Cold outreach to micro-influencers (5k-50k)\n\nAFFILIATE SWIPE FILE (give these to affiliates):\n• 5 social media captions they can use\n• 3 email templates\n• 10 ready-to-post images\n• 5 hashtag sets\n• A one-page product description\n\nAFFILIATE TERMS TO INCLUDE:\n• Cookie duration: 30-60 days\n• Payout schedule: monthly or bi-weekly\n• Minimum payout: $25-50\n• Prohibited: spam, misleading claims, bidding on your brand name\n\nTRACKING AND MANAGEMENT:\n• Use UTM parameters on all affiliate links\n• Monthly performance reports to keep affiliates motivated\n• Recognize top performers publicly\n\n🪷 Need affiliate email templates or a recruitment script?`,

    rebrand:`REBRAND PLAN\n\nORIGINAL: ${val('rebrandDetails')||'Existing product'}\nBRAND: ${val('rebrandBrand')||'Your brand identity'}\n\nSTEP-BY-STEP REBRAND PROCESS:\n\nSTEP 1 — NEW TITLE:\nOld title: Generic PLR title\nNew title formula: "The [Brand Adjective] [Topic] [Format] for [Your Audience]"\nYour new title: "The ZenSereniTee [Topic] Guide for Calm, Intentional Entrepreneurs"\n\nSTEP 2 — NEW COVER DESIGN:\nGo to Canva → Search "ebook cover" or "digital product cover"\nApply your brand colors: Blush #F2DDD5, Gold #C9A55A, Sage #7A9E76\nFont: Cormorant Garamond (heading) + Outfit (body)\nAdd your logo or brand symbol (lotus 🪷)\nDownload as PDF and PNG\n\nSTEP 3 — REWRITE INTRODUCTION:\nReplace the generic intro with YOUR voice\nAdd your personal why and brand philosophy\nMention your brand name naturally 2-3 times\nAdd your link/website at the start and end\n\nSTEP 4 — ADD YOUR BONUSES:\nAdd 1-2 original bonus pages you create yourself\nThis makes your version uniquely valuable\nBonus ideas: resource list, quick-start checklist, template\n\nSTEP 5 — NEW SALES COPY:\nWrite a completely new product description\nHighlight how this fits YOUR audience specifically\nUse your brand voice throughout\n\nSTEP 6 — UPLOAD AND PRICE:\nUpload to your Stan Store or Etsy shop\nPrice competitively with strong value stack\nAdd your affiliate link or upsell at the back\n\n🪷 Need help rewriting the introduction or creating the new cover concept?`,

    repurposeviral:`VIRAL CONTENT REPURPOSING PLAN\nWhat Performed: ${gv2('viralWhat')||'High Saves'}\n\nYOUR VIRAL CONTENT:\n"${val('viralContent')||'[Your viral content here]'}"\n\nWHY IT WORKED (and how to use this):\nContent that gets ${gv2('viralWhat')||'saves'} means your audience found it highly valuable and wanted to return to it. This is your most powerful content signal. Create MORE of this exact type.\n\nREPURPOSING PLAN — 10 NEW PIECES FROM 1:\n\n1. INSTAGRAM CAROUSEL\nExpand the content into 7-10 slides\nOne key point per slide, bold text\nCover slide: "[Number] [Topic] That Will Change Your [Outcome]"\n\n2. PINTEREST PIN (x3)\nCreate 3 different pin designs with same content\nDifferent title, different image angle, same link\nPost on different boards spread over 2 weeks\n\n3. REEL (x2)\nVersion A: Educational talking head style\nVersion B: Text-on-screen B-roll style\n30 seconds each, same core message\n\n4. EMAIL NEWSLETTER\nExpand into 400-word value email to your list\nSubject: "The most saved post I ever made 🪷"\n\n5. BLOG POST\nWrite 800-1200 words around this topic\nSEO optimize for your main keyword\nEmbed the original Instagram post in the blog\n\n6. TWITTER/X THREAD\nBreak into 8-10 tweet thread format\n\n7. TIKTOK VIDEO\nSame message, adapted for TikTok energy and format\n\n8. YOUTUBE SHORT\n60 seconds or less, same core value\n\n9. FACEBOOK GROUP POST\nAdapted for community conversation, end with question\n\n10. LEAD MAGNET EXPANSION\nExpand into a complete free guide\nUse to grow your email list\n\nSCHEDULING STRATEGY:\nWeek 1: Carousel + 1 Reel + Pinterest Pin 1\nWeek 2: TikTok + Email + Pinterest Pin 2\nWeek 3: YouTube Short + Blog + Pinterest Pin 3\nWeek 4: Thread + Facebook + Repromote original\n\n🪷 Need me to write any of these pieces in full?`,

    subscriptions:`SUBSCRIPTION BUSINESS PLAN\nType: ${gv2('subType')||'Membership Community'}\n\nYOUR SUBSCRIPTION FRAMEWORK:\n\nNAME YOUR SUBSCRIPTION:\nFormula: "The [Brand] [Benefit] [Membership/Club/Circle]"\nExamples:\n• "The ZenSereniTee Monthly Creator Club"\n• "The Calm Creator Membership"\n• "The Digital Freedom Circle"\n\nPRICING TIERS:\nStarter: $9-17/month (high volume, low friction)\nCore: $27-47/month (sweet spot for value)\nPremium: $97+/month (high-touch, coaching included)\n\nWHAT TO INCLUDE MONTHLY (pick 3-5):\n• Monthly themed Canva template pack (new each month)\n• Monthly educational training or workshop\n• Monthly content calendar or caption swipe file\n• Private community access (Facebook Group or Circle)\n• Monthly live Q&A session (even 30 min adds huge value)\n• Monthly resource or tool recommendation\n\nFREE PLATFORMS TO HOST YOUR MEMBERSHIP:\n• Facebook Groups — free, familiar to your audience\n• Circle.so — free tier available, beautiful interface\n• Teachable — free plan for basic course/membership\n• Stan Store — subscriptions built in, free platform\n\nLAUNCH STRATEGY:\n• Founding member price: 30-50% off for first 20 members\n• Create urgency: "Founding rate locked in forever"\n• Beta test: Recruit 5-10 beta members for free feedback first\n• Launch to your existing email list first\n\nRETENTION STRATEGY:\n• Deliver more than promised, every single month\n• Create community rituals (weekly check-ins, monthly wins)\n• Recognize members publicly\n• Ask what members want BEFORE you create it\n• Make cancellation easy — trust increases renewals\n\n🪷 Need a full membership launch plan or welcome sequence?`,

    crm:`FREE CRM SETUP GUIDE\nBusiness: ${gv2('crmType')||'Digital Products'}\n\nBEST FREE CRM OPTIONS:\n\nOPTION 1 — NOTION (Recommended for beginners)\nFree forever, highly customizable\nSetup time: 30-60 minutes\nBest for: Solo creators and small teams\n\nCREATE THESE DATABASES IN NOTION:\n1. Leads Database\nColumns: Name, Email, Source, Status, Date, Notes\nStatuses: New Lead → Contacted → Warm → Customer → Lost\n\n2. Customer Database\nColumns: Name, Email, Product Purchased, Date, Revenue, Notes\n\n3. Content Pipeline\nColumns: Post type, Topic, Status, Platform, Publish Date, Performance\n\nOPTION 2 — GOOGLE SHEETS (Simplest)\nFree, accessible from iPhone instantly\nSame columns as above in a spreadsheet\nShare with team members easily\n\nOPTION 3 — HUBSPOT FREE\nProfessional CRM, free forever plan\n100k contacts, email tracking, deal pipeline\nBest when you start getting 20+ leads/week\n\nCRM WORKFLOW:\n1. New lead comes in (from lead magnet or DM)\n2. Add to CRM with source and date\n3. Move through stages: Lead → Warm → Offer Sent → Customer\n4. Tag customers by product purchased\n5. Use for targeted follow-ups and re-engagement\n\nAUTOMATION IDEAS:\n• ConvertKit tags automatically segment your email list\n• When someone buys → automatically tag as customer\n• When someone opts in → automatically start welcome sequence\n• Use Zapier (free) to connect your tools\n\nWEEKLY CRM HABITS:\n• Every Monday: Review new leads from last week\n• Every Wednesday: Follow up with warm leads not yet converted\n• Every Friday: Record week's revenue and wins\n\n🪷 Need a Notion CRM template or Google Sheets setup?`,

    autoreply:`AUTO-REPLY SYSTEM SETUP\nPlatform: ${gv2('autoReplyPlat')||'Instagram DMs'}\n\nINSTAGRAM AUTO-DM SETUP:\n\nFREE TOOLS:\n1. ManyChat (manychat.com) — free plan, most popular\n2. Chatfuel — free tier available\n3. Instagram's Native Automation (in Instagram settings)\n\nSETUP STEPS FOR MANYCHAT:\n1. Go to manychat.com → Connect Instagram\n2. Click Automation → Keywords\n3. Set trigger keyword: "GUIDE" (or any word you choose)\n4. Create response message:\n   "Hey [Name]! I am so happy you asked 🪷\n   Here is your free [guide/resource]: [LINK]\n   Let me know if you have questions!"\n5. Add a follow-up message 24 hours later\n\nHOW TO USE KEYWORD AUTOMATION:\nIn your caption or Reel: "Comment GUIDE below and I will DM you the link instantly 🪷"\nThis creates engagement (comments boost reach) + automates delivery\n\nPOPULAR KEYWORDS TO USE:\n• GUIDE — send your free guide\n• START — send your starter pack\n• INFO — send product information\n• VAULT — send your product link\n• YES — send a yes-based response for sales\n\nEMAIL AUTO-REPLY SETUP:\nTool: ConvertKit or MailerLite (both free)\n1. Create automation: Trigger = new subscriber\n2. Sequence: Welcome → Day 2 story → Day 3 value → Day 5 offer\n3. Tag subscribers by what they opted in for\n4. Create separate sequences for buyers vs prospects\n\nOOO (Out of Office) AUTO-REPLY:\n"Thanks for reaching out! I respond to all messages within 24-48 hours. While you wait, grab my free [resource] here: [LINK]. See you soon! 🪷"\n\nMEASURING SUCCESS:\n• DM open rate: aim for 70%+\n• DM click rate: aim for 30%+\n• Email open rate: aim for 25%+\n\n🪷 Need help setting up a specific automation sequence?`,

    bizEmail:`BUSINESS EMAIL SETUP GUIDE\nNeeded: ${gv2('bizEmailType')||'Complete Email System'}\n\nFREE PROFESSIONAL EMAIL OPTIONS:\n\nOPTION 1 — GOOGLE WORKSPACE (Best, not free)\n$6/month per user — worth every penny\nYou@yourdomain.com — most professional\nGet domain at Namecheap or GoDaddy (~$10-15/year)\n\nOPTION 2 — ZOHO MAIL (Free)\nFree for 1 user with custom domain\nSetup: zoho.com/mail → Free plan → Add your domain\nRequires: Your own domain ($10-15/year on Namecheap)\n\nOPTION 3 — IMPROVMX (Free Email Forwarding)\nFree to forward emails from your domain to Gmail\nYou can reply from Gmail but show your domain email\nBest for: Beginners just starting out\n\nGETTING YOUR DOMAIN:\n1. Go to Namecheap.com (cheapest) or GoDaddy\n2. Search for yourname.com or yourbrand.com\n3. Buy it (~$10-15/year)\n4. Set up email through Zoho (free) or Google Workspace\n\nEMAIL ADDRESS NAMING:\n• hello@yourbrand.com (most friendly)\n• hi@yourbrand.com (casual and approachable)\n• support@yourbrand.com (professional)\n• kenia@yourbrand.com (personal touch)\n\nEMAIL MARKETING PLATFORM (FREE OPTIONS):\n1. ConvertKit — best for creators, free up to 1,000 subscribers\n2. MailerLite — free up to 1,000 subscribers, beautiful designs\n3. Mailchimp — free up to 500 subscribers\n\nEMAIL SIGNATURE:\n[Your Name]\n[Your Title] | [Brand Name]\n[Website URL]\n[Primary Social Link]\n🪷 [Your Tagline]\n\nPROFESSIONAL EMAIL TIPS:\n• Respond within 24-48 hours always\n• Use your business email for ALL business communication\n• Set up auto-reply when unavailable\n• Archive don't delete — every email is searchable\n• Create folders: Customers, Leads, Partnerships, Important\n\n🪷 Need help setting up any specific email platform?`,

    visionboard:`VISION BOARD SCRIPT AND GUIDE\nArea: ${gv2('vbAreas')||'Full Life Vision'}\n\nYOUR VISION STATEMENT:\n"I am building a life and business that gives me complete freedom. Every day I take intentional steps toward the vision I hold for my future. I trust the process. I trust myself."\n\nMANIFESTATION SCRIPT (read daily, morning or evening):\n\nBUSINESS AND CAREER:\nI see myself waking up without an alarm, checking my phone to find sales that came in overnight. My digital business runs on systems I built once. I help hundreds of women achieve their goals through my products. My income grows monthly whether I am actively working or resting.\n\nFINANCIAL:\nI have more than enough. My savings grow. I invest wisely. I give generously. I never check my bank account with anxiety — only with gratitude and confidence.\n\nLIFESTYLE:\nI work from wherever feels right today — a coffee shop in Paris, my dream home office, a beach in Bali. I have complete control over my time. My schedule reflects my priorities, not anyone else's.\n\nDAILY AFFIRMATIONS:\n1. "I am building wealth calmly and consistently."\n2. "Money flows to me easily and often."\n3. "I attract the right audience who values my work."\n4. "My business grows every day whether I work or rest."\n5. "I am worthy of the success I am creating."\n6. "Every action I take moves me closer to my vision."\n7. "I create freedom for myself and inspire others to do the same."\n\nVISION BOARD CATEGORIES:\n📸 Career — laptop, workspace, revenue numbers, freedom\n💰 Financial — specific income number, investments, giving\n🏠 Home — dream home interior, your ideal space\n✈️ Travel — specific destinations you want to visit\n🌱 Growth — books, mentors, skills you want to develop\n❤️ Relationships — quality time, connection, love\n\nHOW TO BUILD YOUR VISION BOARD:\n1. Print or save images that represent your vision\n2. Use Canva to create a digital version (free)\n3. Place it where you see it first thing every morning\n4. Review and update every 3-6 months\n5. Read your affirmations out loud daily\n\n🪷 Need a custom vision board image generated? Go to Image Studio.`
