:root{--blush:#f2c4ce;--blush2:rgba(242,196,206,0.13);--sage:#b2c9ad;--gold:#d4af6e;--gold2:rgba(212,175,110,0.12);--cream:#faf6f0;--ink:#1a1410;--ink2:#3d342e;--muted:#9a8e85;--white:#fff;--border:rgba(212,175,110,0.2);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'Outfit',sans-serif;font-weight:300;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
a{text-decoration:none;color:inherit;}
.topnav{height:52px;background:linear-gradient(135deg,#fdf8f3,#f5ede0);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 .8rem;flex-shrink:0;}
.logo{display:flex;align-items:center;gap:.5rem;}
.lotus{font-size:1.3rem;animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bn{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;}
.bn span{color:var(--gold);}
.navlinks{display:flex;gap:.2rem;overflow-x:auto;}
.navlinks::-webkit-scrollbar{display:none;}
.nl{padding:.28rem .55rem;border-radius:6px;font-size:.68rem;color:var(--ink2);white-space:nowrap;border:1px solid transparent;}
.nl:hover{background:var(--gold2);}
.nl.active{background:linear-gradient(135deg,rgba(242,196,206,0.15),var(--gold2));color:var(--ink);font-weight:500;border-color:var(--border);}
.app{display:flex;flex:1;overflow:hidden;}
.sb{width:220px;min-width:220px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;padding:.5rem;flex-shrink:0;}
.sb::-webkit-scrollbar{width:2px;}
.sb::-webkit-scrollbar-thumb{background:var(--border);}
.slbl{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:.45rem .45rem .15rem;}
.nv{display:flex;align-items:center;gap:.4rem;padding:.42rem .55rem;border-radius:6px;border:none;background:none;cursor:pointer;width:100%;text-align:left;color:var(--ink2);font-family:'Outfit',sans-serif;font-size:.71rem;transition:all .13s;}
.nv:hover{background:var(--gold2);}
.nv.active{background:linear-gradient(135deg,var(--blush2),var(--gold2));color:var(--ink);font-weight:500;border:1px solid var(--border);}
.ni{font-size:.85rem;min-width:17px;text-align:center;}
.sd{height:1px;background:var(--border);margin:.18rem 0;}
.main{flex:1;overflow-y:auto;padding:1rem;}
.main::-webkit-scrollbar{width:4px;}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:.9rem;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blush),var(--gold),var(--sage));}
.card h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;margin-bottom:.25rem;}
.card p{font-size:.78rem;line-height:1.6;color:var(--ink2);}
.flbl{font-family:'DM Mono',monospace;font-size:.53rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:.38rem;display:block;}
.fsec{margin-bottom:.85rem;}
.chips{display:flex;flex-wrap:wrap;gap:.28rem;}
.chip{padding:.3rem .68rem;border-radius:18px;border:1px solid var(--border);background:var(--white);font-size:.7rem;cursor:pointer;color:var(--ink2);font-family:'Outfit',sans-serif;transition:all .13s;}
.chip:hover{border-color:var(--gold);background:var(--gold2);}
.chip.on{background:linear-gradient(135deg,var(--blush),var(--gold));border-color:var(--gold);color:var(--ink);font-weight:500;}
.tin{width:100%;padding:.58rem .78rem;border:1px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;font-size:.78rem;color:var(--ink);background:var(--white);outline:none;resize:vertical;min-height:65px;}
.tin:focus{border-color:var(--gold);}
.tin.big{min-height:105px;border:2px solid var(--gold);font-size:.82rem;}
.sin{min-height:unset;height:36px;resize:none;}
.inp{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;font-size:.78rem;color:var(--ink);background:var(--white);outline:none;}
.inp:focus{border-color:var(--gold);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;}
@media(max-width:600px){.g3,.g4{grid-template-columns:1fr 1fr;}}
.gbtn{width:100%;padding:.75rem;background:linear-gradient(135deg,#c9956a,var(--gold));border:none;border-radius:9px;font-family:'Outfit',sans-serif;font-size:.84rem;font-weight:600;color:var(--ink);cursor:pointer;transition:all .22s;margin-top:.7rem;}
.gbtn:hover{box-shadow:0 4px 18px rgba(212,175,110,.32);transform:translateY(-1px);}
.gbtn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.gbtn.sage{background:linear-gradient(135deg,#3d5c38,var(--sage));}
.abtn{padding:.32rem .72rem;border-radius:6px;border:1px solid rgba(212,175,110,.3);background:rgba(212,175,110,.1);color:var(--gold);font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .13s;text-decoration:none;display:inline-block;}
.abtn:hover{background:rgba(212,175,110,.22);}
.abtn.g{color:var(--sage);border-color:rgba(178,201,173,.3);background:rgba(178,201,173,.08);}
.out{background:#1a1410;border-radius:10px;padding:1rem;margin-top:.8rem;display:none;}
.outlbl{font-family:'DM Mono',monospace;font-size:.53rem;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;}
.outacts{display:flex;gap:.38rem;margin-top:.65rem;flex-wrap:wrap;}
.ld{display:inline-flex;gap:4px;align-items:center;color:#e8ddd4;font-size:.76rem;}
.ld span{width:5px;height:5px;background:var(--gold);border-radius:50%;animation:bounce 1.2s ease-in-out infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.badge{display:inline-block;font-family:'DM Mono',monospace;font-size:.52rem;padding:.17rem .5rem;border-radius:7px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.4rem;}
.bf{background:rgba(178,201,173,.18);color:#3d5c38;border:1px solid rgba(178,201,173,.4);}
.ba{background:rgba(212,175,110,.15);color:#7a5c1e;border:1px solid rgba(212,175,110,.35);}
.upz{border:2px dashed var(--border);border-radius:10px;padding:.85rem;text-align:center;cursor:pointer;background:var(--cream);position:relative;transition:all .18s;}
.upz:hover{border-color:var(--gold);background:var(--gold2);}
.upz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.prevs{display:flex;flex-wrap:wrap;gap:.32rem;margin-top:.45rem;}
.prevw{position:relative;width:56px;}
.prevw img{width:56px;height:56px;border-radius:7px;object-fit:cover;border:2px solid var(--border);}
.rmv{position:absolute;top:-5px;right:-5px;width:16px;height:16px;background:#e05c5c;color:#fff;border:none;border-radius:50%;font-size:.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.toast{position:fixed;bottom:1rem;right:1rem;background:var(--ink);color:var(--gold);font-family:'DM Mono',monospace;font-size:.64rem;padding:.48rem .88rem;border-radius:8px;border:1px solid var(--gold);z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.gen-count{display:flex;gap:.4rem;align-items:center;margin-top:.5rem;}
.gen-count label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.gen-count select{padding:.3rem .5rem;border:1px solid var(--border);border-radius:6px;font-size:.74rem;background:var(--white);color:var(--ink);outline:none;}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem;margin-top:.6rem;}
.img-item{border-radius:9px;overflow:hidden;position:relative;background:#111;}
.img-item img{width:100%;display:block;border-radius:9px;}
.img-item .img-acts{position:absolute;bottom:0;left:0;right:0;background:rgba(26,20,16,.75);padding:.4rem;display:flex;gap:.3rem;justify-content:center;opacity:0;transition:opacity .2s;}
.img-item:hover .img-acts{opacity:1;}
.tool-info{background:linear-gradient(135deg,rgba(242,196,206,0.08),rgba(212,175,110,0.08));border:1px solid var(--border);border-radius:10px;padding:.8rem;margin-bottom:.8rem;font-size:.76rem;color:var(--ink2);line-height:1.65;}
.tool-info strong{color:var(--ink);font-weight:600;}
.step{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.6rem;}
.step-num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--blush),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.62rem;font-weight:600;color:var(--ink);flex-shrink:0;}
.step-text{font-size:.76rem;color:var(--ink2);line-height:1.6;padding-top:3px;}
.free-tool{background:var(--white);border:1px solid var(--border);border-radius:9px;padding:.7rem .85rem;margin-bottom:.45rem;display:flex;align-items:center;gap:.7rem;cursor:pointer;transition:all .18s;}
.free-tool:hover{border-color:var(--gold);background:var(--gold2);}
.ft-icon{font-size:1.3rem;flex-shrink:0;}
.ft-info h4{font-size:.76rem;font-weight:600;color:var(--ink);margin-bottom:.08rem;}
.ft-info p{font-size:.66rem;color:var(--muted);}
.ft-badge{margin-left:auto;font-family:'DM Mono',monospace;font-size:.52rem;color:var(--sage);border:1px solid rgba(178,201,173,.4);border-radius:5px;padding:.12rem .4rem;white-space:nowrap;}
</style>

function go(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nv').forEach(n => n.classList.remove('active'));
  const panel = document.getElementById('p-' + id);
  if (panel) panel.classList.add('active');
  document.querySelectorAll('.nv').forEach(n => {
    if (n.dataset.panel === id) n.classList.add('active');
  });
  document.getElementById('mainContent').scrollTop = 0;
}

function pick(el, g) {
  const grp = document.getElementById(g);
  if (grp) grp.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  else el.closest('.chips').querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
}

function gv(g) {
  const el = document.getElementById(g);
  if (!el) return '';
  const sel = el.querySelector('.chip.on');
  return sel ? sel.textContent.trim() : '';
}

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function cpOut(id) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => toast('Copied!')).catch(() => toast('Long press to copy'));
}

// Check for panel from sessionStorage (coming from index)
window.addEventListener('load', () => {
  const target = sessionStorage.getItem('gotoPanel');
  if (target) { sessionStorage.removeItem('gotoPanel'); go(target); }
});

function polUrl(prompt, w, h, model) {
  const seed = Math.floor(Math.random() * 999999);
  const m = model === 'Stable Diffusion XL' ? 'sdxl' :
            model === 'Turbo (Fastest)' ? 'turbo' :
            model === 'FLUX Realism' ? 'flux-realism' :
            model === 'FLUX Anime' ? 'flux-anime' :
            model === 'FLUX 3D' ? 'flux-3d' : 'flux';
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&model=${m}&nologo=true&seed=${seed}`;
}

function getRatioDims(ratio) {
  const map = {
    'Square 1:1 (1024px)': [1024,1024],
    'Portrait 4:5 (Instagram)': [864,1080],
    'Story 9:16 (Vertical)': [608,1080],
    'Wide 16:9 (Landscape)': [1344,756],
    'Tall 2:3 (Pinterest)': [768,1152],
    'Standard 4:3': [1024,768],
    'Ultra Wide 21:9': [1680,720],
    'Large Square 2048px': [1024,1024]
  };
  return map[ratio] || [1024,1024];
}

function displayImg(url, resultId, actsId, btnId) {
  const result = document.getElementById(resultId);
  const acts = document.getElementById(actsId);
  const btn = btnId ? document.getElementById(btnId) : null;

  const img = new Image();
  img.style.cssText = 'max-width:100%;border-radius:9px;display:block;margin-top:6px;';

  img.onload = () => {
    if (result) { result.innerHTML = ''; result.appendChild(img); }
    if (btn) btn.disabled = false;
    toast('Image ready! ✓');
    if (acts) acts.innerHTML =
      `<a class="abtn" href="${url}" target="_blank" download="cre8ive-image.jpg">⬇ Download JPG</a>` +
      `<a class="abtn" href="${url}" target="_blank">🔗 Open Full Size</a>` +
      `<button class="abtn g" onclick="location.reload()">↺ New</button>`;
  };

  img.onerror = () => {
    if (result) result.innerHTML =
      `<div style="color:#e8ddd4;font-size:.8rem;line-height:2;padding:.5rem;">
      ✦ Image generated!<br>
      <a href="${url}" target="_blank" style="color:var(--gold);text-decoration:underline;">Tap to view your image</a><br>
      <a href="${url}" download style="color:var(--sage);text-decoration:underline;">Tap to download</a>
      </div>`;
    if (btn) btn.disabled = false;
  };
  img.src = url;
}

function startGen(url, resultId, actsId, btnId) {
  const result = document.getElementById(resultId);
  if (result) result.innerHTML = '<div class="ld"><span></span><span></span><span></span></div> Generating... (10-30 seconds)';
  const acts = document.getElementById(actsId);
  if (acts) acts.innerHTML = '';
  displayImg(url, resultId, actsId, btnId);
}

// MAIN IMAGE GENERATOR
async function genImg() {
  const desc = document.getElementById('iDesc').value.trim();
  if (!desc) { toast('Please describe your image first!'); return; }

  const model = gv('iModel') || 'FLUX (Best Quality)';
  const [w, h] = getRatioDims(gv('iRatio') || 'Square 1:1 (1024px)');
  const style = gv('iStyle') !== 'None (Pure Description)' ? gv('iStyle') : '';
  const light = gv('iLight') !== 'None' ? gv('iLight') + ' lighting' : '';
  const color = gv('iColor') !== 'None' ? gv('iColor') + ' colors' : '';
  const camera = gv('iCamera') !== 'None' ? gv('iCamera') : '';
  const scene = gv('iScene') !== 'None' ? 'in ' + gv('iScene') : '';
  const texture = gv('iTexture') !== 'None' ? gv('iTexture') + ' texture' : '';
  const mood = gv('iMood') !== 'None' ? gv('iMood') + ' mood' : '';
  const quality = gv('iQuality') || 'high quality';
  const gender = gv('iGender');
  const eth = gv('iEth');
  const neg = document.getElementById('iNeg').value.trim();
  const ref = document.getElementById('iRef').value.trim();
  const countStr = gv('iCount') || '1 Image';
  const count = parseInt(countStr) || 1;

  const personPart = (gender && gender !== 'No Person') ? ', ' + gender + (eth ? ', ' + eth + ' skin tone' : '') : '';
  const extras = [style, scene, light, color, camera, texture, mood, quality, ref ? 'inspired by: ' + ref : ''].filter(Boolean).join(', ');
  let prompt = desc + personPart + (extras ? ', ' + extras : '');

  // Improve prompt if requested
  const improve = gv('iImprove');
  if (improve === 'Auto-Enhance My Prompt') prompt += ', masterpiece, highly detailed, professional quality, trending on artstation';
  if (improve === 'Make It More Detailed') prompt += ', intricate details, ultra detailed, sharp focus, 8k uhd';
  if (improve === 'Make It More Creative') prompt += ', creative interpretation, artistic vision, unique composition, stunning';
  if (improve === 'Optimize for Realism') prompt += ', photorealistic, shot on Canon EOS R5, natural lighting, ultra realistic';

  const btn = document.getElementById('iBtnGen');
  const out = document.getElementById('iOut');
  btn.disabled = true;
  out.style.display = 'block';

  if (count === 1) {
    const url = polUrl(prompt, w, h, model);
    startGen(url, 'iResult', 'iActs', null);
    document.getElementById('iResult').innerHTML = '<div class="ld"><span></span><span></span><span></span></div> Generating your image...';
    displayImg(url, 'iResult', 'iActs', 'iBtnGen');
  } else {
    // Multiple generations
    document.getElementById('iResult').innerHTML = '<div class="ld"><span></span><span></span><span></span></div> Generating ' + count + ' images...';
    document.getElementById('iActs').innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'img-grid';
    document.getElementById('iResult').innerHTML = '';
    document.getElementById('iResult').appendChild(grid);

    for (let i = 0; i < count; i++) {
      const url = polUrl(prompt, w, h, model);
      const item = document.createElement('div');
      item.className = 'img-item';
      item.innerHTML = '<div class="ld" style="margin:1rem;"><span></span><span></span><span></span></div>';
      grid.appendChild(item);

      const img = new Image();
      img.style.cssText = 'width:100%;display:block;border-radius:9px;';
      const acts = document.createElement('div');
      acts.className = 'img-acts';
      acts.innerHTML = `<a class="abtn" href="${url}" target="_blank" download="cre8ive-${i+1}.jpg">⬇</a><a class="abtn" href="${url}" target="_blank">🔗</a>`;

      img.onload = () => { item.innerHTML = ''; item.appendChild(img); item.appendChild(acts); };
      img.onerror = () => { item.innerHTML = `<a href="${url}" target="_blank" style="color:var(--gold);font-size:.7rem;padding:.5rem;display:block;text-align:center;">Tap to view</a>`; };
      img.src = url;
      await new Promise(r => setTimeout(r, 300)); // slight delay between requests
    }
    btn.disabled = false;
    toast(count + ' images generating!');
  }
}

// ═══ genTool — universal image generator for all tool panels ═══
function genTool(id, descId, w, h) {
  const descEl = document.getElementById(descId);
  if (!descEl) { toast('Panel not found'); return; }
  const desc = descEl.value.trim();
  if (!desc) { toast('Please describe what you want first!'); return; }

  // Build prompt using any chip selections on this panel
  const panel = document.getElementById('p-' + id);
  let chipValues = '';
  if (panel) {
    panel.querySelectorAll('.chips').forEach(grp => {
      const sel = grp.querySelector('.chip.on');
      if (sel) chipValues += sel.textContent.trim() + ', ';
    });
  }

  const prompt = desc + (chipValues ? ', ' + chipValues : '') + 'high quality, professional, detailed';
  const out = document.getElementById(id + 'Out');
  const result = document.getElementById(id + 'Result');
  const acts = document.getElementById(id + 'Acts');
  const btn = document.getElementById(id + 'Btn');

  if (!out || !result) return;
  out.style.display = 'block';
  if (btn) btn.disabled = true;
  result.innerHTML = '<div class="ld"><span></span><span></span><span></span></div> Generating... (10-30 seconds)';
  if (acts) acts.innerHTML = '';

  const url = polUrl(prompt, w, h, 'flux');
  const img = new Image();
  img.style.cssText = 'max-width:100%;border-radius:9px;display:block;margin-top:6px;';
  img.onload = () => {
    result.innerHTML = '';
    result.appendChild(img);
    if (btn) btn.disabled = false;
    toast('Image ready!');
    if (acts) acts.innerHTML =
      `<a class="abtn" href="${url}" target="_blank" download="image.jpg">⬇ Download</a>` +
      `<a class="abtn" href="${url}" target="_blank">🔗 Open Full</a>` +
      `<button class="abtn g" onclick="genTool('${id}','${descId}',${w},${h})">↺ Regenerate</button>`;
  };
  img.onerror = () => {
    result.innerHTML = `<div style="color:#e8ddd4;font-size:.78rem;padding:.5rem;line-height:2;">
      Image generated!<br>
      <a href="${url}" target="_blank" style="color:var(--gold);">Tap to view your image</a><br>
      <a href="${url}" download style="color:var(--sage);">Tap to download</a>
    </div>`;
    if (btn) btn.disabled = false;
  };
  img.src = url;
}

    'Portrait 4:5': [864, 1080],
    'Story 9:16': [608, 1080],
    'Wide 16:9': [1344, 756]
  };
  const [w, h] = dims[sizeStr] || [1024, 1024];
  const basePrompt = desc.value.trim() + ', ' + style + ' style, high quality, professional';

  const btn = document.getElementById('g5Btn');
  const out = document.getElementById('g5Out');
  const grid = document.getElementById('g5Grid');

  if (btn) btn.disabled = true;
  out.style.display = 'block';
  grid.innerHTML = '';
  toast('Generating ' + count + ' images...');

  for (let i = 0; i < count; i++) {
    const url = polUrl(basePrompt + ', variation ' + (i + 1), w, h, 'flux');
    const cell = document.createElement('div');
    cell.style.cssText = 'background:#111;border-radius:8px;overflow:hidden;position:relative;min-height:80px;display:flex;align-items:center;justify-content:center;';
    cell.innerHTML = '<div class="ld"><span></span><span></span><span></span></div>';
    grid.appendChild(cell);

    const img = new Image();
    img.style.cssText = 'width:100%;display:block;border-radius:8px;';
    const acts = document.createElement('div');
    acts.style.cssText = 'position:absolute;bottom:0;left:0;right:0;background:rgba(26,20,16,.8);padding:.3rem;display:flex;gap:.3rem;justify-content:center;opacity:0;transition:opacity .2s;';
    acts.innerHTML = `<a class="abtn" href="${url}" download="img-${i+1}.jpg" style="font-size:.5rem;">⬇ Save</a><a class="abtn" href="${url}" target="_blank" style="font-size:.5rem;">🔗 Open</a>`;
    cell.addEventListener('mouseenter', () => acts.style.opacity = '1');
    cell.addEventListener('mouseleave', () => acts.style.opacity = '0');

    img.onload = () => { cell.innerHTML = ''; cell.appendChild(img); cell.appendChild(acts); };
    img.onerror = () => { cell.innerHTML = `<a href="${url}" target="_blank" style="color:var(--gold);font-size:.7rem;padding:.5rem;">Image ${i+1} — tap to view</a>`; };
    img.src = url;
    await new Promise(r => setTimeout(r, 350));
  }
  if (btn) btn.disabled = false;
}

function genGuide(type) {
  const guides = {
    photoedit: () => {
      const fx = gv('editFx') || 'Color Correction';
      const desc = document.getElementById('editDesc').value || '';
      return `PHOTO EDITING GUIDE: ${fx}\n\nBEST FREE TOOLS:\n1. Canva (canva.com) — drag and drop, beginner friendly\n2. Snapseed — professional mobile editing on iPhone, free\n3. Photopea.com — full Photoshop alternative, free browser tool\n4. Lightroom Mobile — color grading, free tier\n5. Cleanup.pictures — object removal, free\n\nSTEP-BY-STEP FOR ${fx.toUpperCase()}:\n\nStep 1: Open your image in Canva or Snapseed\nStep 2: Navigate to the ${fx} tools in the editor\nStep 3: Make adjustments gradually — small changes look most natural\nStep 4: Compare before and after using the preview toggle\nStep 5: Export at highest quality available\nStep 6: Save to camera roll or download\n\nPRO TIPS:\n• Always work on a copy of your original\n• Use the undo button freely — experiment without fear\n• For professional results, adjust brightness first, then contrast, then color\n• Canva's one-click filters give instant professional results\n• Snapseed's Selective tool lets you edit specific areas only\n\n🪷 Need help with a specific editing challenge?`;
    },
    img2prompt: () => {
      const desc = document.getElementById('i2pDesc').value || '';
      const platform = gv('i2pPlatform') || 'Pollinations / FLUX';
      return `AI IMAGE PROMPT FOR ${platform.toUpperCase()}:\n\nBased on your description, here is your optimized prompt:\n\n[PROMPT START]\n${desc}, highly detailed, professional quality, sharp focus, perfect composition, trending on artstation, award winning photography\n[PROMPT END]\n\nPLATFORM-SPECIFIC TIPS FOR ${platform.toUpperCase()}:\n\n${platform === 'Midjourney' ? '• Add --ar 4:5 for portrait\n• Add --style raw for realism\n• Add --v 6 for latest model\n• Add --quality 2 for extra detail' : platform === 'Stable Diffusion' ? '• Use CFG scale 7-9 for best results\n• Steps: 20-30 minimum\n• Use negative prompts to avoid unwanted elements\n• SDXL gives best quality' : '• Use this prompt directly in Pollinations Image Generator\n• Try different models: FLUX, Turbo, FLUX Realism\n• Add style chips for extra control\n• Generate up to 5 variations'}\n\nNEGATIVE PROMPT (add to improve quality):\nblurry, low quality, distorted, watermark, text overlay, bad anatomy, extra limbs, low resolution, grainy\n\n🪷 Need me to refine this prompt further?`;
    }
  };

  const fn = guides[type];
  if (!fn) return;

  const outId = 'out-' + type;
  const txtId = 'outtxt-' + type;
  const out = document.getElementById(outId);
  const txt = document.getElementById(txtId);
  if (!out || !txt) return;
  out.style.display = 'block';
  txt.textContent = fn();
}
