<!DOCTYPE html>
<html>
<head>
  <title>Cre8tive Vib3s</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    .box { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    #chat { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
    input { width: 80%; padding: 10px; }
    button { padding: 10px; }
  </style>
</head>

<body>

<div class="box">
  <h2>Cre8tive Vib3s Chat</h2>

  <div id="chat"></div>

  <input id="input" placeholder="Type a message..." />
  <button onclick="send()">Send</button>
</div>

<script>
const API_URL = "https://cre8tive-vib3s-clean.onrender.com/api/chat";

function add(role, text){
  const div = document.createElement("div");
  div.innerHTML = "<b>" + role + ":</b> " + text;
  document.getElementById("chat").appendChild(div);
}

async function send(){
  const input = document.getElementById("input");
  const text = input.value;
  if(!text) return;

  add("You", text);
  input.value = "";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [
          { role: "user", content: text }
        ]
      })
    });

    const data = await res.json();
    add("AI", data.reply || "No response from server");

  } catch (err) {
    add("AI", "Connection error");
  }
}
</script>

</body>
</html>
