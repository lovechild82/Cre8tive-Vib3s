<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cre8ive Vib3s — Unified SaaS</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Outfit,sans-serif;background:#faf6f0;color:#1a1410;height:100vh;display:flex;flex-direction:column}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;background:#fff;border-bottom:1px solid #ddd
}

.brand{font-weight:600}

.tabs{display:flex;gap:6px;overflow:auto}

.tab{
  padding:6px 10px;border:1px solid #ddd;border-radius:8px;
  cursor:pointer;font-size:12px;white-space:nowrap;background:#fff
}

.tab.active{background:#f2e3c7}

.view{display:none;flex:1;overflow:hidden}

#chat{display:flex;flex-direction:column;height:100%}

.messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

.msg{padding:10px;border-radius:10px;max-width:80%}

.user{background:#d4af6e;align-self:flex-end}

.ai{background:#fff;border:1px solid #ddd;align-self:flex-start}

.input{
  display:flex;padding:10px;gap:8px;border-top:1px solid #ddd;background:#fff
}

input{
  flex:1;padding:10px;border:1px solid #ddd;border-radius:8px
}

button{
  padding:10px 12px;border:none;background:#d4af6e;border-radius:8px;cursor:pointer
}

.placeholder{padding:20px;color:#777;font-size:14px}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">Cre8ive Vib3s SaaS</div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('chat')">Chat</div>
    <div class="tab" onclick="switchTab('image')">Images</div>
    <div class="tab" onclick="switchTab('video')">Video</div>
    <div class="tab" onclick="switchTab('writing')">Writing</div>
    <div class="tab" onclick="switchTab('marketing')">Marketing</div>
    <div class="tab" onclick="switchTab('products')">Products</div>
  </div>
</div>

<!-- CHAT -->
<div id="chat" class="view" style="display:flex;flex-direction:column">
  <div class="messages" id="messages"></div>

  <div class="input">
    <input id="input" placeholder="Ask your AI..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- OTHER MODULES -->
<div id="image" class="view">
  <div class="placeholder">Image Studio ready for AI integration</div>
</div>

<div id="video" class="view">
  <div class="placeholder">Video Studio ready for AI integration</div>
</div>

<div id="writing" class="view">
  <div class="placeholder">Writing tools hub</div>
</div>

<div id="marketing" class="view">
  <div class="placeholder">Marketing + funnel tools hub</div>
</div>

<div id="products" class="view">
  <div class="placeholder">Digital product builder hub</div>
</div>

<script>

/* =========================
   TAB SYSTEM
========================= */
function switchTab(id){
  document.querySelectorAll('.view').forEach(v=>v.style.display='none');
  document.getElementById(id).style.display='flex';

  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
}

/* =========================
   CHAT SYSTEM
========================= */
function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text) return;

  add(text,'user');
  input.value='';

  setTimeout(()=>{
    add(generate(text),'ai');
  },400);
}

function add(text,type){
  const div=document.createElement('div');
  div.className='msg '+type;
  div.innerText=text;
  document.getElementById('messages').appendChild(div);
}

/* =========================
   FULL “BRAIN” ENGINE
   (your unified logic layer)
========================= */
function generate(msg){
  msg=msg.toLowerCase();

  // DIGITAL PRODUCTS
  if(msg.includes('digital product') || msg.includes('sell')){
    return `Start with a simple $27 PDF guide.\n\nSolve ONE problem:\n- beginner audience\n- clear outcome\n- fast to create\n\nThen sell it with Instagram + Pinterest.`;
  }

  // FUNNEL
  if(msg.includes('funnel')){
    return `Simple funnel:\n1. Free lead magnet\n2. Email list\n3. 5-email sequence\n4. $27 product\n5. weekly emails`;
  }

  // CONTENT
  if(msg.includes('caption')){
    return `Caption formula:\nHook → Pain → Insight → CTA\nKeep it short, clear, and direct.`;
  }

  // BRANDING
  if(msg.includes('brand')){
    return `Brand system:\n- Clear niche\n- Simple promise\n- Consistent visuals\n- Repeated messaging`;
  }

  // DEFAULT
  return `Focus on one clear outcome.\nRemove everything unnecessary.\nBuild the smallest version that works and sell it first.`;
}

</script>

</body>
</html>
