<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cre8ive Vib3s — AI SaaS</title>

<style>
body{margin:0;font-family:Arial;background:#faf6f0;height:100vh;display:flex;flex-direction:column}

.top{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #ddd}

.tabs{display:flex;gap:6px;overflow:auto}
.tab{padding:6px 10px;border:1px solid #ddd;border-radius:8px;cursor:pointer;font-size:12px;background:#fff}
.tab.active{background:#f2d7a7}

.view{display:none;flex:1;overflow:auto;padding:12px}

#chatView{display:flex;flex-direction:column}

.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}

.msg{padding:10px;border-radius:10px;max-width:80%}
.user{background:#d4af6e;align-self:flex-end}
.ai{background:#fff;border:1px solid #ddd}

.input{display:flex;gap:8px;padding-top:10px}
input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px}
button{padding:10px 12px;border:none;background:#d4af6e;border-radius:8px;cursor:pointer}

.card{background:#fff;border:1px solid #ddd;padding:10px;border-radius:10px;margin-bottom:10px}

.title{font-weight:bold;margin-bottom:6px}
</style>
</head>

<body>

<div class="top">
  <div><b>Cre8ive Vib3s AI</b></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('chatView')">Chat</div>
    <div class="tab" onclick="switchTab('imageView')">Images</div>
    <div class="tab" onclick="switchTab('videoView')">Video</div>
    <div class="tab" onclick="switchTab('writeView')">Writing</div>
    <div class="tab" onclick="switchTab('marketView')">Marketing</div>
    <div class="tab" onclick="switchTab('productView')">Products</div>
  </div>
</div>

<!-- CHAT -->
<div id="chatView" class="view" style="display:flex;flex-direction:column">
  <div class="messages" id="messages"></div>

  <div class="input">
    <input id="input" placeholder="Ask anything..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- IMAGE -->
<div id="imageView" class="view"></div>

<!-- VIDEO -->
<div id="videoView" class="view"></div>

<!-- WRITING -->
<div id="writeView" class="view"></div>

<!-- MARKETING -->
<div id="marketView" class="view"></div>

<!-- PRODUCTS -->
<div id="productView" class="view"></div>

<script>

/* =========================
   TAB SYSTEM
========================= */
function switchTab(id){
  document.querySelectorAll('.view').forEach(v=>v.style.display='none');
  document.getElementById(id).style.display='block';

  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');

  renderTab(id);
}

/* =========================
   CHAT ENGINE
========================= */
function send(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text) return;

  add(text,'user');
  input.value='';

  const res = router(text,'chat');

  setTimeout(()=>{
    add(res,'ai');
  },300);
}

function add(text,type){
  const div=document.createElement('div');
  div.className='msg '+type;
  div.innerText=text;
  document.getElementById('messages').appendChild(div);
}

/* =========================
   MULTI-TOOL BRAIN (ROUTER)
========================= */
function router(msg,mode){
  msg=msg.toLowerCase();

  if(mode==='chat'){
    if(msg.includes('start')||msg.includes('how')){
      return "Start simple: pick one problem, build one digital product, sell it at $27.";
    }
    if(msg.includes('funnel')){
      return "Lead magnet → Email list → 5 emails → $27 product → weekly emails.";
    }
    if(msg.includes('caption')){
      return "Hook → Pain → Insight → CTA. Keep it short and clear.";
    }
    return "Focus on one goal. Remove everything else. Execute consistently.";
  }

  if(mode==='image'){
    return `IMAGE PROMPT:\nClean aesthetic product shot, soft lighting, minimal branding, high quality, commercial style`;
  }

  if(mode==='video'){
    return `VIDEO SCRIPT:\nHook (3 sec)\nProblem\nSolution\nCall to action`;
  }

  if(mode==='write'){
    return `WRITING STRUCTURE:\nHook → Story → Value → CTA\nKeep sentences simple and direct.`;
  }

  if(mode==='market'){
    return `MARKETING FUNNEL:\n1. Content\n2. Lead magnet\n3. Email sequence\n4. Offer\n5. Retarget`;
  }

  if(mode==='product'){
    return `PRODUCT IDEA:\nCreate a $27 digital guide solving one specific beginner problem.`;
  }

  return msg;
}

/* =========================
   TAB RENDERING (KEY FIX)
========================= */
function renderTab(id){

  const el=document.getElementById(id);

  if(id==='imageView'){
    el.innerHTML = card("Image Generator","Type a concept → get prompt: " + router("","image"));
  }

  if(id==='videoView'){
    el.innerHTML = card("Video Generator", router("","video"));
  }

  if(id==='writeView'){
    el.innerHTML = card("Writing Tool", router("","write"));
  }

  if(id==='marketView'){
    el.innerHTML = card("Marketing System", router("","market"));
  }

  if(id==='productView'){
    el.innerHTML = card("Product Builder", router("","product"));
  }
}

/* =========================
   UI CARD
========================= */
function card(title,content){
  return `<div class="card"><div class="title">${title}</div><div>${content}</div></div>`;
}

/* init default tab */
renderTab('chatView');

</script>

</body>
</html>
