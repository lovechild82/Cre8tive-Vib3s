<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cre8tive Vib3s</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    #app {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    #chat {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    input {
      width: 75%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #333;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>

<body>

<div id="app">

  <h2>Cre8tive Vib3s Chat</h2>

  <div id="chat"></div>

  <input id="input" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>

</div>

<script>
const API_URL = "https://cre8tive-vib3s-1.onrender.com/api/chat";

async function sendMessage() {
  const input = document.getElementById("input");
  const chatBox = document.getElementById("chat");

  const userText = input.value.trim();
  if (!userText) return;

  input.value = "";

  chatBox.innerHTML += `<div><b>You:</b> ${userText}</div>`;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [
          { role: "user", content: userText }
        ]
      })
    });

    const data = await res.json();

    chatBox.innerHTML += `<div><b>AI:</b> ${data.reply || "No response from server."}</div>`;

  } catch (err) {
    chatBox.innerHTML += `<div><b>AI:</b> Connection error.</div>`;
  }
}
</script>

</body>
</html>
